<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NO SIGNAL</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05070c; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .badge {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      font: 700 14px/1 "Courier New", monospace;
      letter-spacing: 0.35em;
      color: rgba(94,200,255,0.85);
      text-shadow: 0 0 12px rgba(94,200,255,0.5);
      border: 1px solid rgba(94,200,255,0.35);
      padding: 0.75rem 1.25rem;
      background: rgba(0,0,0,0.55);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="badge">NO SIGNAL</div>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    function resize() {
      c.width = Math.min(640, window.innerWidth);
      c.height = Math.min(400, window.innerHeight);
    }
    resize();
    window.addEventListener('resize', resize);
    function snow() {
      const { width: w, height: h } = c;
      const img = ctx.createImageData(w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = (Math.random() * 60) | 0;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      requestAnimationFrame(snow);
    }
    snow();
  </script>
</body>
</html>
